// DISTANCE
function dist(a,b){
const R=6371;
let dLat=(b.lat-a.lat)*Math.PI/180;
let dLon=(b.lon-a.lon)*Math.PI/180;
let x=Math.sin(dLat/2)**2+
Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*
Math.sin(dLon/2)**2;
return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// GREEDY ROUTE (DSA)
function routeOrder(places){
let visited=new Array(places.length).fill(false);
let order=[0];
visited[0]=true;

while(order.length<places.length){
let last=order[order.length-1];
let min=Infinity, idx=-1;

for(let i=0;i<places.length;i++){
if(!visited[i]){
let d=dist(places[last],places[i]);
if(d<min){min=d; idx=i;}
}
}
visited[idx]=true;
order.push(idx);
}
return order;
}

// SEARCH
function search(){
const city=document.getElementById("city").value.toLowerCase();
const output=document.getElementById("output");

if(!data[city]){
output.innerHTML="❌ City not available";

let {places,food}=data[city];

map.invalidateSize();
map.setView([places[0].lat,places[0].lon],12);

// clear
markers.forEach(m=>map.removeLayer(m));

// sort
places.sort((a,b)=>dist(places[0],a)-dist(places[0],b));

// display places
output.innerHTML="<h2>Tourist Places</h2>";

markers.push(L.marker([p.lat,p.lon]).addTo(map).bindPopup(p.name));

output.innerHTML+=`

<b>${p.name}</b><br>
📏 ${dist(places[0],p).toFixed(2)} km
<img src="${p.img}">
</div>`;
});

<div class="card">
<b>${f.name}</b><br>
🏨 ${f.hotel}
<img src="${f.img}">
</div>`;
});

// route line
let order=routeOrder(places);
let latlngs=order.map(i=>[places[i].lat,places[i].lon]);
routeLine = L.polyline(latlngs,{color:'red'}).addTo(map);

}
