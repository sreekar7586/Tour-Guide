<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Smart Tour Guide
    </title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }

        body {

            font-family: 'Poppins', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #1e293b
                );

            color: white;

            min-height: 100vh;

            overflow-x: hidden;

            padding: 30px;
        }

        body::before {

            content: "";

            position: fixed;

            width: 500px;

            height: 500px;

            background:
                rgba(56,189,248,0.15);

            filter: blur(120px);

            top: -100px;

            left: -100px;

            z-index: -1;
        }

        body::after {

            content: "";

            position: fixed;

            width: 400px;

            height: 400px;

            background:
                rgba(168,85,247,0.15);

            filter: blur(120px);

            bottom: -100px;

            right: -100px;

            z-index: -1;
        }

        /* HEADER */

        .header {

            text-align: center;

            margin-bottom: 60px;
        }

        .header h1 {

            font-size: 5rem;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #a855f7,
                    #06b6d4
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            margin-bottom: 20px;

            text-shadow:
                0 0 30px rgba(56,189,248,0.4);
        }

        .header p {

            font-size: 1.4rem;

            color: #cbd5e1;
        }

        /* SEARCH */

        .search-container {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            margin-bottom: 60px;
        }

        .search-container input {

            width: 65%;

            padding: 20px;

            border-radius: 20px;

            border: none;

            outline: none;

            background:
                rgba(255,255,255,0.1);

            color: white;

            font-size: 1.1rem;

            backdrop-filter: blur(10px);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.3);
        }

        .search-container input::placeholder {

            color: #cbd5e1;
        }

        .search-container button {

            padding: 20px 35px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #8b5cf6
                );

            color: white;

            font-size: 1.1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.4s;

            box-shadow:
                0 8px 25px rgba(56,189,248,0.4);
        }

        .search-container button:hover {

            transform:
                translateY(-4px)
                scale(1.05);
        }

        /* SECTION */

        .section {

            margin-top: 60px;

            padding: 35px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.06);

            backdrop-filter: blur(15px);

            border:
                1px solid rgba(255,255,255,0.1);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        .section-title {

            font-size: 2.5rem;

            margin-bottom: 30px;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #a855f7
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        /* GRID */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px,1fr));

            gap: 30px;
        }

        /* CARDS */

        .card {

            background:
                rgba(255,255,255,0.08);

            border-radius: 25px;

            padding: 30px;

            transition: 0.4s;

            border:
                1px solid rgba(255,255,255,0.08);

            position: relative;

            overflow: hidden;
        }

        .card::before {

            content: "";

            position: absolute;

            width: 100%;

            height: 5px;

            background:
                linear-gradient(
                    90deg,
                    #38bdf8,
                    #8b5cf6
                );

            top: 0;

            left: 0;
        }

        .card:hover {

            transform:
                translateY(-10px)
                scale(1.02);

            background:
                rgba(255,255,255,0.12);
        }

        .card h3 {

            font-size: 1.8rem;

            color: #7dd3fc;

            margin-bottom: 18px;
        }

        .card p {

            font-size: 1rem;

            color: #e2e8f0;

            line-height: 1.8;
        }

        /* MAP */

        #map {

            height: 650px;

            margin-top: 50px;

            border-radius: 30px;

            overflow: hidden;

            border:
                2px solid rgba(255,255,255,0.1);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        /* FOOTER */

        .footer {

            margin-top: 60px;

            text-align: center;

            color: #94a3b8;

            font-size: 1.1rem;
        }

        .error {

            color: #f87171;

            text-align: center;

            font-size: 1.3rem;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <h1>
            🌍 Smart Tour Guide
        </h1>

        <p>
            Discover Amazing Tourist Attractions Around The World
        </p>

    </div>

    <!-- SEARCH -->

    <div class="search-container">

        <input
            type="text"
            id="cityInput"
            placeholder="Search any city..."
        >

        <button onclick="searchCity()">
            Explore
        </button>

    </div>

    <!-- RESULTS -->

    <div id="results"></div>

    <!-- MAP -->

    <div id="map"></div>

    <!-- FOOTER -->

    <div class="footer">

        ✈️ Explore • Travel • Experience

    </div>

    <script>

        let map;

        async function searchCity() {

            const city =
                document.getElementById("cityInput").value;

            const resultsDiv =
                document.getElementById("results");

            try {

                const response =
                    await fetch(
                        `http://localhost:5000/search?city=${city}`
                    );

                const data =
                    await response.json();

                if (data.error) {

                    resultsDiv.innerHTML =
                        `<p class="error">
                            ${data.error}
                        </p>`;

                    return;
                }

                let html = `

                <div class="section">

                    <h2 class="section-title">
                        🌍 Tourist Attractions
                    </h2>

                    <div class="grid">
                `;

                data.places.forEach(place => {

                    html += `

                    <div class="card">

                        <h3>
                            📍 ${place.name}
                        </h3>

                        <p>
                            ${place.address}
                        </p>

                    </div>
                    `;
                });

                html += `
                    </div>
                </div>



                <div class="section">

                    <h2 class="section-title">
                        🗺️ Smart Travel Itinerary
                    </h2>

                    <div class="grid">
                `;

                data.places.forEach((place, index) => {

                    html += `

                    <div class="card">

                        <h3>
                            Stop ${index + 1}
                        </h3>

                        <p>
                            📍 ${place.name}
                        </p>

                        <p>
                            ${place.address}
                        </p>

                    </div>
                    `;
                });

                html += `
                    </div>
                </div>
                `;

                resultsDiv.innerHTML = html;


                // REMOVE OLD MAP
                if (map) {

                    map.remove();
                }

                // CREATE MAP
                map =
                    L.map('map').setView(
                        [
                            data.places[0].lat,
                            data.places[0].lon
                        ],
                        12
                    );

                L.tileLayer(
                    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                    {
                        attribution:
                            '&copy; OpenStreetMap contributors'
                    }
                ).addTo(map);


                const routePoints = [];

                data.places.forEach(place => {

                    const coordinates =
                        [place.lat, place.lon];

                    routePoints.push(
                        coordinates
                    );

                    L.marker(coordinates)

                        .addTo(map)

                        .bindPopup(

                            `
                            <b>${place.name}</b>

                            <br><br>

                            ${place.address}
                            `
                        );
                });


                // CONNECT ITINERARY ROUTE
                L.polyline(
                    routePoints,
                    {
                        color: '#38bdf8',

                        weight: 7,

                        opacity: 0.9,

                        dashArray: '12,10'
                    }
                ).addTo(map);

            }

            catch (error) {

                console.log(error);

                resultsDiv.innerHTML =
                    `<p class="error">
                        Backend not working
                    </p>`;
            }
        }

    </script>

</body>

</html>
