name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm install
        
    - name: Verify backend works
      run: |
        cd backend
        npm test
        
    - name: Check server syntax
      run: |
        cd backend
        node -c server.js
        echo "✅ Backend syntax check passed"
      
    - name: Build status
      run: echo "✅ All checks passed!"
