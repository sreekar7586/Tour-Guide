name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set deployment environment
      run: |
        if [ "${{ github.event.inputs.environment }}" == "staging" ]; then
          echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
          echo "DEPLOY_URL=https://tour-guide-staging.example.com" >> $GITHUB_ENV
        else
          echo "DEPLOY_ENV=production" >> $GITHUB_ENV
          echo "DEPLOY_URL=https://tour-guide.example.com" >> $GITHUB_ENV
        fi
        
    - name: Deploy using docker-compose
      run: |
        echo "Deploying to ${{ env.DEPLOY_ENV }} environment"
        echo "Deployment URL: ${{ env.DEPLOY_URL }}"
        
        # Example: Deploy using SSH
        # ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
        #   cd /app/tour-guide
        #   git pull origin main
        #   docker-compose pull
        #   docker-compose up -d
        # EOF
        
        # For now, just validate docker-compose file
        docker-compose config > /dev/null
        
    - name: Run health checks
      run: |
        echo "✅ Running health checks..."
        # Add health check endpoints here
        # curl -f http://${{ env.DEPLOY_URL }}/health || exit 1
        
    - name: Verify deployment
      run: |
        echo "✅ Deployment to ${{ env.DEPLOY_ENV }} successful!"
        echo "Services:"
        echo "  - Frontend: ${{ env.DEPLOY_URL }}:3000"
        echo "  - Backend API: ${{ env.DEPLOY_URL }}:5000"
        
    - name: Slack Notification (Optional)
      if: always()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "Deployment Status",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment to ${{ env.DEPLOY_ENV }}*\nStatus: ${{ job.status }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                }
              }
            ]
          }
      if: ${{ secrets.SLACK_WEBHOOK != '' }}
